name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 测试并构建 ad-hoc 版本
        run: |
          make test

          version="${GITHUB_REF_NAME#v}"
          project_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$project_version" ]]; then
            echo "::error::标签版本 $version 与 VERSION 文件 $project_version 不一致"
            exit 1
          fi

          APP_VERSION="$version" \
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
          CODE_SIGN_IDENTITY="-" \
            ./scripts/build_app.sh

      - name: 验证应用包
        run: |
          plutil -lint dist/TorranceKit.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/TorranceKit.app
          file dist/TorranceKit.app/Contents/MacOS/TorranceKit | grep arm64

      - name: 打包并创建 GitHub Release
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/TorranceKit-$version-macOS-arm64.zip"

          ditto -c -k --norsrc --keepParent dist/TorranceKit.app "$archive"
          (
            cd dist
            shasum -a 256 \
              "TorranceKit-$version-macOS-arm64.zip" \
              > "TorranceKit-$version-macOS-arm64.zip.sha256"
          )

          gh release create \
            "$GITHUB_REF_NAME" \
            "$archive" \
            "$archive.sha256" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
